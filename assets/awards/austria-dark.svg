<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-label="Estación de la línea de logros: ganador de la categoría Open Source en Your Future Made in Austria, noviembre 2025, con RailSense."><title>Estación de la línea de logros: ganador de la categoría Open Source en Your Future Made in Austria, noviembre 2025, con RailSense.</title><style>.sans{font-family:'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
    .shine { animation: shine 8s ease-in-out infinite; }
