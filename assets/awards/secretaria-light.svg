<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-label="Estación de la línea de logros: 1er lugar en SEDECO SecretarIA Hackathon, junio 2026, con MercurIA."><title>Estación de la línea de logros: 1er lugar en SEDECO SecretarIA Hackathon, junio 2026, con MercurIA.</title><style>.sans{font-family:'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
    .shine { animation: shine 8s ease-in-out infinite; }
    @keyframes shine { 0% { transform: translateX(0) } 12%,100% { transform: translateX(340px) } }

    .train { transform: translateX(-180px); animation: run2 15.0s linear infinite; }
    @keyframes run2 {
      0% { transform: translateX(-180px) }
      33.33% { transform: translateX(-180px); animation-timing-function: ease-out }
      39.67% { transform: translateX(152.0px) }
      43.67% { transform: translateX(152.0px); animation-timing-function: ease-in }
      50.00%, 100% { transform: translateX(460px) }
    }
    .ping { animation: ping 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
    @keyframes ping { 0% { opacity: .6; transform: scale(.95) } 100% { opacity: 0; transform: scale(1.25) } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .motion { display: none; } }</style>
