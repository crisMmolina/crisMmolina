    .pop { animation: pop 3s ease-in-out infinite both; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes pop { 0% { opacity: 0; transform: translateY(-12px) } 15%,80% { opacity: 1; transform: none } 100% { opacity: 0 } }
